# App name and SPHEREX_ALLOWED_HOSTS are filled after Fly account login.
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  SPHEREX_BIND = "0.0.0.0"
  SPHEREX_PORT = "8765"
  SPHEREX_CACHE_DIR = "/data"

[[mounts]]
  source = "spherex_data"
  destination = "/data"

[http_service]
  internal_port = 8765
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/health"
    [http_service.checks.headers]
      Host = "localhost"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
